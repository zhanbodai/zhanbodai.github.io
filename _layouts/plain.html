<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} - {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="/images/favicon.ico">
  <link rel="preload" href="/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-name" href="/">Zhanbo Dai</a>
      <nav class="site-nav" aria-label="Main">
        <a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>About</a>
        <a href="/portfolio/"{% if page.url contains "/portfolio/" %} aria-current="page"{% endif %}>Projects</a>
        <a href="/cv/"{% if page.url == "/cv/" %} aria-current="page"{% endif %}>CV</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="wrap">
{{ content }}
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">Zhanbo Dai, Madison, WI. <a href="mailto:zhanbodai@outlook.com">zhanbodai@outlook.com</a></div>
  </footer>
</body>
</html>
