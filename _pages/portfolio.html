---
layout: plain
title: "Projects"
permalink: /portfolio/
---
<h1 class="display">Projects</h1>

{% for post in site.portfolio %}
<article class="project">
  <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
  <p class="where">{{ post.context }}</p>
  <p class="prose">{{ post.excerpt }}</p>
  <ul class="tags" aria-label="Tools">{% for t in post.tools %}<li>{{ t }}</li>{% endfor %}</ul>
</article>
{% endfor %}
